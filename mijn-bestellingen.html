<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mijn Bestellingen — Treasureshirt</title>
  <link rel="icon" href="images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .orders-wrap {
      min-height: 100vh;
      padding: 7rem 1.5rem 4rem;
      max-width: 780px;
      margin: 0 auto;
    }
    .orders-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
      border-bottom: 1px solid rgba(255,200,61,.15);
      padding-bottom: 1.25rem;
    }
    .orders-title {
      font-size: 1.4rem;
      letter-spacing: .12em;
      font-weight: 300;
    }
    .orders-back {
      font-size: .68rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--gray);
      text-decoration: none;
      transition: color .2s;
    }
    .orders-back:hover { color: var(--gold); }

    .order-card {
      border: 1px solid rgba(255,200,61,.15);
      margin-bottom: 1.25rem;
      background: #111;
    }
    .order-card-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid rgba(255,200,61,.08);
      gap: 1rem;
      flex-wrap: wrap;
    }
    .order-number {
      font-size: .72rem;
      letter-spacing: .25em;
      text-transform: uppercase;
      color: var(--gold);
    }
    .order-date {
      font-size: .72rem;
      color: var(--gray);
      }
    .order-status {
      font-size: .62rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      padding: .3rem .7rem;
      border: 1px solid rgba(255,200,61,.3);
      color: var(--gold);
    }
    .order-status.verzonden { border-color: rgba(39,174,96,.4); color: #27ae60; }
    .order-status.afgerond  { border-color: rgba(39,174,96,.4); color: #27ae60; }
    .order-status.geannuleerd { border-color: rgba(231,76,60,.4); color: #e74c3c; }

    .order-items { padding: 1rem 1.25rem; }
    .order-item-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: .45rem 0;
      border-bottom: 1px solid rgba(255,255,255,.04);
      font-size: .88rem;
      gap: 1rem;
    }
    .order-item-row:last-child { border-bottom: none; }
    .order-item-name { color: var(--white); flex: 1; }
    .order-item-qty  { color: var(--gray); font-size: .78rem; white-space: nowrap; }
    .order-item-price { color: var(--gold); white-space: nowrap; }

    .order-card-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: .85rem 1.25rem;
      border-top: 1px solid rgba(255,200,61,.08);
      background: rgba(255,200,61,.03);
    }
    .order-shipping {
      font-size: .72rem;
      color: var(--gray);
      flex: 1;
    }
    .order-total {
      font-size: .95rem;
      letter-spacing: .08em;
    }
    .order-total strong { color: var(--gold); }

    .orders-empty {
      text-align: center;
      padding: 4rem 0;
      color: var(--gray);
      }
    .orders-empty a { color: var(--gold); text-decoration: none; }

    .orders-loading {
      text-align: center;
      padding: 4rem 0;
      color: var(--gray);
      font-size: .82rem;
      letter-spacing: .15em;
      text-transform: uppercase;
    }
      /* 2026 restyle */
    .orders-title { font-family: var(--font-display); font-weight: 800; letter-spacing: -0.02em; text-transform: none; }
    .order-card { border-radius: var(--radius); border: 1px solid var(--line); background: var(--dark-gray); }
    .order-number, .order-status { letter-spacing: .04em; }
    .order-status { border-radius: 999px; }
    .orders-back { letter-spacing: 0; text-transform: none; }
  </style>
</head>
<body>
  <nav>
    <a href="index.html" class="nav-logo">Treasureshirt</a>
    <ul class="nav-links" id="navLinks">
      <li><a href="shop.html" class="nav-kerst">🎄 Kerstcollectie</a></li>
      <li><a href="kerstmarkt.html">Kerstmarkt</a></li>
      <li><a href="about.html">Over ons</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
    <div style="display:flex;gap:1rem;align-items:center">
      <button class="nav-cart" id="cartBtn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l-1 13H7L6 7Z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg><span class="cart-label">Winkelwagen</span> <span class="cart-badge" id="cartCount">0</span></button>
      <button class="nav-toggle" id="navToggle" aria-label="Menu openen"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <div class="cart-overlay" id="cartOverlay">
    <div class="cart-drawer" id="cartDrawer">
      <div class="cart-header">
        <h3>Winkelwagen</h3>
        <button class="cart-close" id="cartClose" aria-label="Sluiten">✕</button>
      </div>
      <div class="cart-items" id="cartItems"></div>
      <div class="cart-footer">
        <div class="cart-total-row">
          <span class="cart-total-label">Subtotaal</span>
          <span class="cart-total-amount" id="cartTotal">€ 0</span>
        </div>
        <p class="cart-note">🎄 Gratis afhalen op de kerstmarkt van Landen of verzending (€ 7). Verzenden: bestel vóór 8 december.</p>
        <button class="btn-checkout" id="checkoutBtn" disabled>Afrekenen →</button>
      </div>
    </div>
  </div>

  <div class="orders-wrap">
    <div class="orders-header">
      <h1 class="orders-title">Mijn Bestellingen</h1>
      <a href="account.html" class="orders-back">← Mijn Account</a>
    </div>
    <div id="ordersList">
      <p class="orders-loading">Laden…</p>
    </div>
  </div>

  <div class="cart-toast" id="cartToast"></div>
  <script src="js/main.js"></script>
  <script src="js/cart.js"></script>
  <script type="module">
    import { auth } from './js/firebase-config.js';
    import { db }   from './js/firebase-config.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
    import {
      collection, query, where, getDocs,
    } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

    onAuthStateChanged(auth, async user => {
      if (!user) {
        window.location.href = 'account.html';
        return;
      }
      await loadOrders(user.uid);
    });

    async function loadOrders(uid) {
      const list = document.getElementById('ordersList');
      try {
        const q = query(
          collection(db, 'custom-orders'),
          where('userId', '==', uid),
        );
        const snap = await getDocs(q);

        if (snap.empty) {
          list.innerHTML = `<p class="orders-empty">Je hebt nog geen bestellingen geplaatst.<br><br><a href="shop.html">Bekijk de kerstcollectie →</a></p>`;
          return;
        }

        const sortedDocs = snap.docs.sort((a, b) => (b.data().createdAt?.seconds || 0) - (a.data().createdAt?.seconds || 0));
        list.innerHTML = sortedDocs.map(doc => {
          const o = doc.data();
          const date = o.createdAt?.toDate
            ? o.createdAt.toDate().toLocaleDateString('nl-BE', { day: '2-digit', month: 'long', year: 'numeric' })
            : '—';

          const statusClass = (o.status || '').toLowerCase().replace(/\s/g, '-');
          const statusLabel = {
            'pending_payment': 'Wacht op betaling',
            'paid': 'Betaald',
            'betaald': 'Betaald',
            'klaar': 'Klaar',
            'in_productie': 'In productie',
            'verzonden': 'Verzonden',
            'geleverd': 'Geleverd',
          }[o.status] || o.status || 'Nieuw';

          const product = o.typeKleding === 'hoodie' ? 'Hoodie' : 'T-Shirt';

          return `
            <div class="order-card">
              <div class="order-card-head">
                <span class="order-number"># ${doc.id.slice(-8).toUpperCase()}</span>
                <span class="order-date">${date}</span>
                <span class="order-status ${statusClass}">${statusLabel}</span>
              </div>
              <div class="order-items">
                <div class="order-item-row">
                  <span class="order-item-name">Op Maat ${product} — ${o.maat || ''} — ${o.kledingKleur || ''}</span>
                </div>
                <div class="order-item-row" style="color:#8f8b83;font-size:.8rem;">
                  ${o.thema || ''}
                </div>
              </div>
              <div class="order-card-foot">
                <span class="order-shipping">${o.adres || ''}</span>
                <span class="order-total">Totaal: <strong>€ ${o.totaalprijs || '—'}</strong></span>
              </div>
            </div>`;
        }).join('');

      } catch (err) {
        console.error(err);
        list.innerHTML = `<p class="orders-empty">Kon bestellingen niet laden. Probeer later opnieuw.</p>`;
      }
    }
  </script>
</body>
</html>
