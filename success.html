<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Betaling geslaagd — Treasureshirt</title>
  <link rel="icon" href="images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .result-page { display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:2rem; }
    .result-box { max-width:480px; }
    .result-icon { font-size:4rem; margin-bottom:2rem; }
    .result-box h1 { font-family:var(--font-display); font-size:clamp(2.2rem,6vw,3rem); font-weight:800; letter-spacing:-0.03em; line-height:1.05; margin-bottom:1rem; }
    .result-box h1 span { color:var(--gold); }
    .result-box p { color:var(--gray); line-height:1.9; margin-bottom:2rem; }
  </style>
</head>
<body>
  <div class="result-page">
    <div class="result-box">
      <div class="result-icon">🎉</div>
      <h1>Bedankt, <span>het is gelukt!</span></h1>
      <p>Je ontvangt zo een bevestiging per e-mail met je bestelnummer. Koos je voor afhalen op de kerstmarkt? Dan sturen we je een mail zodra je bestelling klaarligt in onze chalet.</p>
      <a href="shop.html" class="btn btn-filled">Verder winkelen</a>
    </div>
  </div>
  <script>localStorage.removeItem('ts_cart');</script>
</body>
</html>
